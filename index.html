<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jファームシマザキ HPリニューアル モック</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@400;500;700&family=Fraunces:ital,wght@1,400;1,500;0,400;0,500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  html, body { margin: 0; padding: 0; background: #1c160d; color-scheme: dark; }
  * { box-sizing: border-box; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; }
  /* Page-level transitions */
  @keyframes jf-fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes jf-slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }
  /* Scrollbar (subtle) */
  main[data-scroll-root]::-webkit-scrollbar { width: 8px; }
  main[data-scroll-root]::-webkit-scrollbar-thumb { background: rgba(62,47,30,0.18); border-radius: 4px; }
  main[data-scroll-root]::-webkit-scrollbar-track { background: transparent; }
  /* Reduce link click feedback */
  a, button { -webkit-tap-highlight-color: transparent; }
  input:focus, textarea:focus, select:focus { border-color: var(--c-primary, #6F8E5A) !important; box-shadow: 0 0 0 3px rgba(111,142,90,0.12) !important; }
  /* ── Narrow (mobile frame) layout overrides ───────────────────────── */
  main[data-narrow] section { padding-left: 16px !important; padding-right: 16px !important; }
  main[data-narrow] h1 { font-size: clamp(22px, 6vw, 28px) !important; line-height: 1.45 !important; letter-spacing: 0.01em !important; word-break: keep-all !important; overflow-wrap: anywhere !important; }
  main[data-narrow] h2 { font-size: clamp(17px, 4.5vw, 20px) !important; word-break: keep-all; }
  main[data-narrow] h3 { font-size: clamp(15px, 4vw, 17px) !important; word-break: keep-all; }
  main[data-narrow] p { word-break: keep-all; overflow-wrap: break-word; }
  /* compact header on mobile */
  main[data-narrow] header { height: 52px !important; padding: 0 12px !important; gap: 8px !important; }
  /* collapse 2-col grids */
  main[data-narrow] section[style*="grid-template-columns"] { grid-template-columns: 1fr !important; gap: 20px !important; padding-top: clamp(24px, 6vw, 40px) !important; padding-bottom: clamp(24px, 6vw, 40px) !important; }
  main[data-narrow] section > div[style*="grid-template-columns"],
  main[data-narrow] section > [style*="grid-template-columns"] { grid-template-columns: 1fr !important; gap: 20px !important; }
  /* collapse ltr/rtl alternating layouts */
  main[data-narrow] [style*="direction: rtl"] { direction: ltr !important; }
  /* hero heights shrink */
  main[data-narrow] section[style*="86vh"],
  main[data-narrow] section[style*="70vh"] { min-height: 480px !important; }
  /* hide footer 3-col -> 1-col */
  main[data-narrow] footer > div:first-child { grid-template-columns: 1fr !important; gap: 20px !important; }
  /* form 2-col fields -> 1 */
  main[data-narrow] form div[style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
  /* card grids auto-fit fine but make timeline 2-col stack */
  main[data-narrow] section > [style*="minmax(0, 1fr) minmax(0, 1.4fr)"],
  main[data-narrow] section > [style*="minmax(0, 1fr) minmax(0, 1.2fr)"],
  main[data-narrow] section > [style*="minmax(0, 1.2fr) minmax(0, 1fr)"],
  main[data-narrow] section > [style*="minmax(0, 1.1fr) minmax(0, 1fr)"] { grid-template-columns: 1fr !important; }
  /* side nav on pc frame when within mobile ... n/a */
  main[data-narrow] dl > div[style*="160px 1fr"] { grid-template-columns: 110px 1fr !important; }
  main[data-narrow] li[style*="grid-template-columns: 120px 1fr auto"] { grid-template-columns: 78px 1fr auto !important; gap: 10px !important; }
  @keyframes ig-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>

<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>

</html>
